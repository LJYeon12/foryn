# -------------------
# H2 (MySQL 호환 모드)
# -------------------
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MYSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA 설정
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# -------------------
# 내장 MongoDB (Flapdoodle)
# -------------------
spring.data.mongodb.database=testdb
spring.data.mongodb.port=0
de.flapdoodle.mongodb.embedded.version=6.0.9

# 애플 테스트용 값
apple.team-id=dummy
apple.key-id=dummy
apple.key.path=dummy
apple.client-id=dummy
apple.store.issuer-id=dummy
apple.store.bundle-id=dummy
apple.store.key-id=dummy
apple.store.key.path=dummy
apple.store.key.base64=

# -------------------
# JWT 테스트용 값
# -------------------
jwt.secret=test-secret-key-for-testing-must-be-at-least-256-bits-long-12345678
jwt.expiration_time=3600000

# -------------------
# 캐시 테스트용 값
# -------------------
spring.cache.cache-names=dummy
spring.cache.caffeine.spec=maximumSize=1,expireAfterWrite=1s

spring.ai.openai.api-key=dummy-test-key

# Cloud Tasks (테스트용 값)
cloud-tasks.project-id=test-project
cloud-tasks.location-id=test-location
cloud-tasks.queue-id=test-queue
cloud-tasks.target-base-url=https://test.example.com
cloud-tasks.task-execution-sa-email=test@test.iam.gserviceaccount.com

# 알림 예약 모드
notification.scheduling.mode=cloud-tasks
chat.recovery.enabled=false
